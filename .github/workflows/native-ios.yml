name: Native iOS candidate

on:
  pull_request:
    paths: ['native-ios/**', 'scripts/native-ios-project.mjs', '.github/workflows/native-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check project graph
        run: node scripts/native-ios-project.mjs
      - name: Test domain and backup behavior
        run: swift test --package-path native-ios/ArchiveCore
      - name: Compile native iOS app for simulator
        run: >-
          xcodebuild -project native-ios/Archive.xcodeproj -scheme Archive
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath native-ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Boot one simulator and capture native Home
        timeout-minutes: 5
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available --json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith("iPhone"));if(!d)process.exit(1);process.stdout.write(d.udid)})')"
          echo "ARCHIVE_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" native-ios/DerivedData/Build/Products/Debug-iphonesimulator/Archive.app
          mkdir -p native-ios/screenshots
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl launch "$SIMULATOR_ID" com.kyle.archive
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot native-ios/screenshots/home-light.png
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          sleep 1
          xcrun simctl io "$SIMULATOR_ID" screenshot native-ios/screenshots/home-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-simulator-screens
          path: native-ios/screenshots/
          if-no-files-found: ignore
      - name: Run native workout and storage tests
        timeout-minutes: 8
        run: >-
          xcodebuild -project native-ios/Archive.xcodeproj -scheme Archive
          -destination "platform=iOS Simulator,id=$ARCHIVE_SIMULATOR_ID"
          -parallel-testing-enabled NO
          -maximum-concurrent-test-simulator-destinations 1
          -derivedDataPath native-ios/DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Simulator diagnostics on failure
        if: failure() && env.ARCHIVE_SIMULATOR_ID != ''
        run: |
          xcrun simctl list devices available
          xcrun simctl spawn "$ARCHIVE_SIMULATOR_ID" log show --last 3m --style compact --predicate 'process == "Archive"' | tail -n 120
