name: Archive validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web and Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install exact dependencies
        run: npm ci

      - name: Verify workspace and web app
        run: npm run verify

      - name: Synchronize Capacitor Android project
        run: npm run cap:sync

      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew

      - name: Run Android tests, lint, and debug assembly
        working-directory: android
        run: ./gradlew test lint assembleDebug --no-daemon
